<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUXA — Advanced Vehicle Innovation Platform</title>
  <meta name="description" content="Discover, showcase, and acquire advanced vehicle concepts, engineering innovations, and automotive projects. Curated by Antonio." />
  <meta name="theme-color" content="#05080f" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #05080f;
      color: #F0F4FF;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #c {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .atm {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60vw 60vh at 15% 5%,  rgba(0,102,204,.14) 0%, transparent 70%),
        radial-gradient(ellipse 70vw 70vh at 88% 95%, rgba(255,107,53,.14) 0%, transparent 65%);
    }

    .hero {
      position: relative; z-index: 2;
      width: 100%; height: 100svh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }

    .ww {
      position: relative;
      width: min(72vw, 320px);
      height: min(72vw, 320px);
      margin-bottom: 48px;
    }
    @media (min-width: 640px) {
      .ww { width: 380px; height: 380px; }
    }

    .glow {
      position: absolute; inset: -22px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,255,.18), transparent 68%);
      filter: blur(20px);
      opacity: 0.5;
      transition: opacity .1s;
    }

    .ring {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(0,212,255,.1);
      pointer-events: none;
    }
    .ring:nth-child(2) { inset: -14px; }
    .ring:nth-child(3) { inset: -28px; }
    .ring:nth-child(4) { inset: -42px; }

    .wheel {
      position: absolute; inset: 0; border-radius: 50%;
      overflow: hidden;
      box-shadow:
        0 0 80px rgba(0,0,0,.9),
        0 0 160px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.12);
      will-change: transform;
    }
    .wheel img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .wheel-fb {
      width: 100%; height: 100%;
      background: conic-gradient(
        from 0deg,
        #1a2035 0deg 30deg, #263050 30deg 60deg,
        #1a2035 60deg 90deg, #263050 90deg 120deg,
        #1a2035 120deg 150deg, #263050 150deg 180deg,
        #1a2035 180deg 210deg, #263050 210deg 240deg,
        #1a2035 240deg 270deg, #263050 270deg 300deg,
        #1a2035 300deg 330deg, #263050 330deg 360deg
      );
      display: flex; align-items: center; justify-content: center;
    }
    .wheel-fb::after {
      content: ''; width: 36%; height: 36%;
      background: #090d1a; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.08);
    }

    .blur-ring {
      position: absolute; inset: -4px; border-radius: 50%;
      border: 6px solid rgba(200,200,200,0);
      pointer-events: none;
      transition: border-color .3s;
    }

    .wordmark {
      font-size: clamp(58px, 14vw, 100px);
      font-weight: 700; letter-spacing: -.04em;
      line-height: 1; text-align: center; color: #fff;
      margin-bottom: 14px;
      opacity: 0; transform: scale(.88) translateY(12px);
      transition: opacity .5s cubic-bezier(.16,1,.3,1),
                  transform .5s cubic-bezier(.16,1,.3,1);
    }
    .wordmark.show { opacity: 1; transform: scale(1) translateY(0); }

    .tag {
      font-size: clamp(13px, 2.8vw, 17px);
      font-weight: 400; letter-spacing: .04em;
      text-align: center; color: rgba(240,244,255,.45);
      margin-bottom: 44px; max-width: 340px; line-height: 1.5;
      opacity: 0; transform: translateY(16px);
      transition: opacity .6s cubic-bezier(.16,1,.3,1),
                  transform .6s cubic-bezier(.16,1,.3,1);
    }
    .tag.show { opacity: 1; transform: translateY(0); }

    .btns {
      display: flex; flex-direction: column;
      gap: 12px; width: 100%; max-width: 320px;
      opacity: 0; transform: translateY(16px);
      transition: opacity .6s cubic-bezier(.16,1,.3,1),
                  transform .6s cubic-bezier(.16,1,.3,1);
    }
    @media (min-width: 480px) {
      .btns { flex-direction: row; max-width: 400px; }
    }
    .btns.show { opacity: 1; transform: translateY(0); }

    .btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 15px 28px; border-radius: 16px;
      font-size: 15px; font-weight: 600;
      text-decoration: none; cursor: pointer;
      transition: transform .25s cubic-bezier(.16,1,.3,1),
                  box-shadow .25s cubic-bezier(.16,1,.3,1),
                  background .2s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: .01em;
    }
    .btn-primary {
      background: rgba(0,102,204,.88); color: #fff;
      border: 1px solid rgba(0,168,255,.35);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 28px rgba(0,102,204,.35), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .btn-primary:hover {
      background: rgba(0,120,235,.95); transform: translateY(-3px);
      box-shadow: 0 10px 40px rgba(0,102,204,.5), inset 0 1px 0 rgba(255,255,255,.22);
    }
    .btn-secondary {
      background: rgba(255,255,255,.055); color: rgba(240,244,255,.82);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,.1); transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(0,0,0,.35);
    }
    .btn:active { transform: translateY(0) scale(.97) !important; }

    @media (prefers-reduced-motion: reduce) {
      .wordmark, .tag, .btns {
        transition: opacity .001ms !important;
        transform: none !important;
      }
      .wordmark.show, .tag.show, .btns.show { opacity: 1; }
    }

    /* ── Hamburger button ── */
    .ham {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.14);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      transition: background .2s, transform .2s;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      outline: none;
    }
    .ham:hover  { background: rgba(255,255,255,.16); transform: scale(1.05); }
    .ham:active { transform: scale(.95); }
    .ham:focus-visible { box-shadow: 0 0 0 3px rgba(0,168,255,.4); }
    .ham span {
      display: block; width: 20px; height: 1.5px;
      background: rgba(240,244,255,.82); border-radius: 2px;
      transition: transform .32s cubic-bezier(.16,1,.3,1), opacity .22s;
      transform-origin: center;
    }
    .ham.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .ham.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .ham.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* ── Drawer backdrop ── */
    .dov {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.52); backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .dov.show { opacity: 1; pointer-events: all; }

    /* ── Drawer ── */
    .drawer {
      position: fixed; inset: 0 auto 0 0;
      width: min(300px, 86vw); z-index: 51;
      background: rgba(7,11,24,.92);
      backdrop-filter: blur(28px) saturate(1.3);
      -webkit-backdrop-filter: blur(28px) saturate(1.3);
      border-right: 1px solid rgba(255,255,255,.1);
      transform: translateX(-100%);
      transition: transform .36s cubic-bezier(.16,1,.3,1);
      display: flex; flex-direction: column;
      box-shadow: 6px 0 48px rgba(0,0,0,.6);
    }
    .drawer.open { transform: translateX(0); }

    .d-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 20px 18px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .d-logo {
      font-size: 21px; font-weight: 700; letter-spacing: -.04em;
      color: #fff; text-decoration: none;
    }
    .d-x {
      width: 32px; height: 32px; border-radius: 9px;
      background: rgba(255,255,255,.07); border: none; cursor: pointer;
      color: rgba(240,244,255,.55); display: flex; align-items: center;
      justify-content: center; font-size: 15px;
      transition: background .18s, color .18s;
    }
    .d-x:hover { background: rgba(255,255,255,.14); color: #fff; }

    .d-nav {
      flex: 1; overflow-y: auto; padding: 14px 12px;
      display: flex; flex-direction: column;
    }
    .d-sep {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(240,244,255,.28);
      padding: 14px 10px 5px;
    }
    .d-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 12px; border-radius: 11px;
      color: rgba(240,244,255,.7); font-size: 14.5px; font-weight: 500;
      text-decoration: none; cursor: pointer;
      transition: background .16s, color .16s;
    }
    .d-item:hover { background: rgba(255,255,255,.09); color: #fff; }
    .d-item svg { opacity: .5; flex-shrink: 0; transition: opacity .16s; }
    .d-item:hover svg { opacity: .85; }

    .d-foot {
      padding: 14px 14px 22px;
      border-top: 1px solid rgba(255,255,255,.07);
      display: flex; gap: 9px;
    }
    .d-foot a {
      flex: 1; text-align: center; padding: 12px;
      border-radius: 13px; font-size: 14px; font-weight: 600;
      text-decoration: none; transition: all .2s;
    }
    .d-login {
      background: rgba(255,255,255,.07); color: rgba(240,244,255,.78);
      border: 1px solid rgba(255,255,255,.1);
    }
    .d-login:hover { background: rgba(255,255,255,.13); color: #fff; }
    .d-signup {
      background: rgba(0,102,204,.85); color: #fff;
      border: 1px solid rgba(0,168,255,.3);
    }
    .d-signup:hover { background: rgba(0,120,235,.95); }
  </style>
</head>

<div class="hero">

    <div class="glow" id="glow"></div>

    <div class="ring"></div>

        src="images/hero-tire.jpg"
        alt="LUXA Wheel"
        onerror="this.outerHTML='<div class=wheel-fb></div>'"
      />

  </div>

  <h1 class="wordmark" id="wordmark">LUXA</h1>
  <p class="tag" id="tag">Advanced Vehicle Innovation Platform</p>

    <a href="signup.html" class="btn btn-primary">Sign Up</a>
    <a href="login.html"  class="btn btn-secondary">Log In</a>
  </div>
</div>

<script>
(function () {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    ['wordmark','tag','btns'].forEach(id => document.getElementById(id).classList.add('show'));
    return;
  }

  const cv  = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, ox, oy, R;

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    const el = document.getElementById('wheel');
    if (!el) return;
    const r = el.getBoundingClientRect();
    ox = r.left + r.width  / 2;
    oy = r.top  + r.height / 2;
    R  = r.width / 2;
  }
  window.addEventListener('resize', () => { clearTimeout(window._rt); window._rt = setTimeout(resize, 80); });

  const DEG_FAST = 2160;
  const DEG_IDLE = 90;
  const TAU      = 1.3;

  let angle    = 0;
  let lastTs   = null;
  let startTs  = null;
  let showDone = false;

  const pool = [];
  const MAX_P = 200;

  function mkP(speed) {
    const a   = Math.random() * Math.PI * 2;
    const d   = R * (.85 + Math.random() * .2);
    const spd = (speed / DEG_FAST) * (2 + Math.random() * 4) + .3;
    const smoke = Math.random() > .35;
    return {
      x:  ox + Math.cos(a) * d,
      y:  oy + Math.sin(a) * d,
      vx: Math.cos(a) * spd + (Math.random()-.5) * spd * .6,
      vy: Math.sin(a) * spd - Math.random() * spd * .5,
      life: .7 + Math.random() * .3,
      decay: .005 + Math.random() * .01,
      size: smoke ? 4 + Math.random() * 6 : 1 + Math.random() * 2.5,
      smoke,
      g: Math.floor(130 + Math.random() * 120),
    };
  }

  function triggerText() {
    if (showDone) return;
    showDone = true;
    setTimeout(() => document.getElementById('wordmark').classList.add('show'), 0);
    setTimeout(() => document.getElementById('tag').classList.add('show'),      500);
    setTimeout(() => document.getElementById('btns').classList.add('show'),     1000);
  }

  function frame(ts) {
    if (!startTs) {
      startTs = ts;
      resize();
    }
    const dt = lastTs ? Math.min((ts - lastTs) / 1000, .05) : .016;
    lastTs = ts;
    const elapsed = (ts - startTs) / 1000;

    const speed = DEG_IDLE + (DEG_FAST - DEG_IDLE) * Math.exp(-elapsed / TAU);
    const speedRatio = (speed - DEG_IDLE) / (DEG_FAST - DEG_IDLE);

    angle += speed * dt;
    const wheel = document.getElementById('wheel');
    if (wheel) wheel.style.transform = `rotate(${angle}deg)`;

    const glow = document.getElementById('glow');
    if (glow) glow.style.opacity = (.2 + speedRatio * .8).toFixed(2);

    const blurRing = document.getElementById('blurRing');
    if (blurRing) {
      const alpha = speedRatio * .45;
      blurRing.style.borderColor = `rgba(200,200,200,${alpha.toFixed(2)})`;
      blurRing.style.filter = speedRatio > .1 ? `blur(${(speedRatio * 6).toFixed(1)}px)` : 'none';
    }

    if (speedRatio < .35) triggerText();

    const spawnRate = speedRatio * 6 + .3;
    const toSpawn = Math.floor(spawnRate) + (Math.random() < (spawnRate % 1) ? 1 : 0);
    for (let i = 0; i < toSpawn; i++) {
      let slot = pool.find(p => p.life <= 0);
      if (!slot && pool.length < MAX_P) { slot = mkP(speed); pool.push(slot); }
      else if (slot) Object.assign(slot, mkP(speed));
    }

    ctx.clearRect(0, 0, W, H);
    pool.forEach(p => {
      if (p.life <= 0) return;
      p.x  += p.vx;
      p.y  += p.vy;
      p.vx *= .975;
      p.vy  = p.vy * .975 - .015;
      p.life -= p.decay;
      if (p.smoke) p.size += .1;

      const alpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(.1, p.smoke ? p.size : p.size * .5), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.g},${p.g},${p.g+15},${(alpha * (p.smoke ? .25 : .75)).toFixed(2)})`;
      ctx.fill();
    });

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>

<script>
// ── Drawer ──
(function(){
  const ham=document.getElementById('ham'),
        dov=document.getElementById('dov'),
        dr =document.getElementById('drawer'),
        dx =document.getElementById('dx');

  function open(){
    ham.classList.add('open'); dr.classList.add('open'); dov.classList.add('show');
    ham.setAttribute('aria-expanded','true'); dr.setAttribute('aria-hidden','false');
    dr.querySelector('.d-x').focus();
  }
  function close(){
    ham.classList.remove('open'); dr.classList.remove('open'); dov.classList.remove('show');
    ham.setAttribute('aria-expanded','false'); dr.setAttribute('aria-hidden','true');
    ham.focus();
  }
  ham.addEventListener('click',()=>dr.classList.contains('open')?close():open());
  dx.addEventListener('click',close);
  dov.addEventListener('click',close);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
})();
</script>
