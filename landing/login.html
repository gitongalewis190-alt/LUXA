<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — LUXA</title>
  <meta name="theme-color" content="#05080f" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%; background: #05080f; color: #F0F4FF;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scene / Background ──
       Admin: set data-scene-bg on <body> to override background theme.
       Define your theme by overriding --scene-bg CSS variable, e.g.:
       body[data-scene-bg="dawn"] { --scene-bg: #your-color; }               */
    .scene {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none;
    }
    .scene svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    #stars { position: absolute; inset: 0; }

    /* ── Toast ── */
    .toasts{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 40px));}
    .toast{padding:14px 16px;border-radius:14px;font-size:13.5px;font-weight:500;backdrop-filter:blur(20px);display:flex;align-items:center;gap:9px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:tIn .3s cubic-bezier(.16,1,.3,1) both;}
    .toast.error{background:rgba(220,50,50,.18);border:1px solid rgba(220,50,50,.3);color:#ff9090;}
    .toast.success{background:rgba(0,200,100,.13);border:1px solid rgba(0,200,100,.25);color:#5dffb0;}
    .toast.info{background:rgba(0,120,255,.15);border:1px solid rgba(0,120,255,.25);color:#80c8ff;}
    .toast-x{margin-left:auto;background:none;border:none;color:inherit;cursor:pointer;opacity:.5;font-size:15px;padding:0 0 0 6px;line-height:1;}
    .toast-x:hover{opacity:1;}
    .toast.out{animation:tOut .22s ease-in forwards;}
    @keyframes tIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:translateX(0)}}
    @keyframes tOut{to{opacity:0;transform:translateX(36px)}}

    /* ── Spinner ── */
    .spin{width:17px;height:17px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0;}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* ── Nav ── */
    nav{display:flex;align-items:center;padding:15px 32px;gap:28px;backdrop-filter:blur(12px);background:rgba(5,8,15,.25);border-bottom:1px solid rgba(255,255,255,.06);position:relative;z-index:3;}
    .nav-logo{font-size:20px;font-weight:700;letter-spacing:-.03em;color:#fff;text-decoration:none;}
    .nav-links{display:flex;gap:26px;list-style:none;margin:0;}
    .nav-links a{font-size:13.5px;color:rgba(240,244,255,.5);text-decoration:none;transition:color .2s;}
    .nav-links a:hover{color:rgba(240,244,255,.9);}
    .nav-end{margin-left:auto;}
    .nav-cta{padding:8px 18px;border-radius:20px;background:rgba(0,102,204,.7);border:1px solid rgba(0,168,255,.3);color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:background .2s;}
    .nav-cta:hover{background:rgba(0,120,235,.9);}
    @media(max-width:580px){.nav-links{display:none;}.nav-logo{font-size:18px;}}

    /* ── Back button ── */
    .back-btn{position:fixed;top:78px;left:22px;z-index:5;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);color:rgba(240,244,255,.75);cursor:pointer;transition:background .2s,transform .2s,color .2s;}
    .back-btn:hover{background:rgba(255,255,255,.16);transform:translateX(-2px);color:#fff;}
    .back-btn:active{transform:translateX(-2px) scale(.95);}
    .back-btn:focus-visible{outline:2px solid rgba(0,168,255,.7);outline-offset:2px;}
    .back-btn svg{width:18px;height:18px;flex-shrink:0;}
    @media(max-width:580px){.back-btn{position:static;flex-shrink:0;margin-right:-14px;}}

    /* ── Page / Card ── */
    .page{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;}
    .center{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px;}
    .card{width:100%;max-width:448px;background:rgba(8,13,28,.62);backdrop-filter:blur(28px) saturate(1.2);-webkit-backdrop-filter:blur(28px) saturate(1.2);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:44px 40px;box-shadow:0 32px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);animation:rise .7s cubic-bezier(.16,1,.3,1) both;}
    @media(max-width:500px){.card{padding:28px 20px;border-radius:22px;}}
    .card-logo{display:block;text-align:center;font-size:23px;font-weight:700;letter-spacing:-.04em;color:#fff;text-decoration:none;margin-bottom:4px;}
    .card-sub{text-align:center;font-size:13px;color:rgba(240,244,255,.38);margin-bottom:36px;}
    h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-bottom:26px;}
    @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}

    /* ── Fields ── */
    .field{margin-bottom:18px;}
    .flabel{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(240,244,255,.42);margin-bottom:7px;}
    .fwrap{position:relative;}
    .fwrap input{width:100%;padding:13px 16px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:13px;color:#F0F4FF;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;-webkit-appearance:none;appearance:none;}
    .fwrap input:focus{border-color:rgba(0,160,255,.5);box-shadow:0 0 0 3px rgba(0,160,255,.1);background:rgba(255,255,255,.09);}
    .fwrap input::placeholder{color:rgba(240,244,255,.22);}
    .fwrap input.pad-r{padding-right:46px;}
    .eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(240,244,255,.3);padding:4px;display:flex;transition:color .2s;}
    .eye:hover{color:rgba(240,244,255,.7);}
    .eye:focus-visible{outline:2px solid rgba(0,168,255,.7);outline-offset:2px;border-radius:4px;}
    .fwrap input:focus-visible{outline:none;}

    /* Forgot link */
    .forgot-row{display:flex;justify-content:flex-end;margin-top:6px;}
    .forgot-row a{font-size:12px;color:rgba(0,168,255,.65);text-decoration:none;transition:color .2s;}
    .forgot-row a:hover{color:#00D4FF;}
    .forgot-row a:focus-visible{outline:2px solid rgba(0,168,255,.7);outline-offset:2px;border-radius:3px;}

    /* ── Button ── */
    .btn{width:100%;padding:14px;background:rgba(0,102,204,.9);color:#fff;font-size:15px;font-weight:600;border:1px solid rgba(0,168,255,.35);border-radius:15px;cursor:pointer;font-family:inherit;letter-spacing:.01em;box-shadow:0 4px 24px rgba(0,102,204,.3),inset 0 1px 0 rgba(255,255,255,.15);transition:all .2s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;justify-content:center;gap:9px;margin-top:4px;}
    .btn:hover:not(:disabled){background:rgba(0,120,235,.95);transform:translateY(-2px);box-shadow:0 10px 36px rgba(0,102,204,.45);}
    .btn:active:not(:disabled){transform:translateY(0) scale(.98);}
    .btn:disabled{opacity:.38;cursor:not-allowed;background:rgba(50,55,80,.7);border-color:rgba(255,255,255,.07);box-shadow:none;transform:none;}
    .btn:focus-visible{outline:2px solid rgba(0,168,255,.8);outline-offset:2px;}

    /* ── Divider ── */
    .div{display:flex;align-items:center;gap:11px;margin:22px 0;color:rgba(240,244,255,.22);font-size:12px;}
    .div::before,.div::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}

    /* ── Social buttons ── */
    .socials{display:flex;gap:8px;}
    .sbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(240,244,255,.72);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .2s,transform .2s;white-space:nowrap;}
    .sbtn:hover{background:rgba(255,255,255,.12);transform:translateY(-2px);}
    .sbtn:active{transform:scale(.97);}
    .sbtn:focus-visible{outline:2px solid rgba(0,168,255,.7);outline-offset:2px;}
    .si{width:17px;height:17px;flex-shrink:0;}

    /* ── Footer ── */
    .cfoot{text-align:center;margin-top:26px;font-size:13px;color:rgba(240,244,255,.36);}
    .cfoot a{color:rgba(0,168,255,.75);text-decoration:none;}
    .cfoot a:hover{color:#00D4FF;}

    /* ── Reduced motion ── */
    @media(prefers-reduced-motion:reduce){
      .card,.toast{animation:none;}
      .spin{animation:none;border-top-color:#fff;}
    }
  </style>
</head>
<body>

<!-- ── Toast container ── -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- ── Page ── -->
<div class="page">
  <nav>
    <button type="button" class="back-btn" id="back-btn" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <a href="index.html" class="nav-logo">LUXA</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">About</a></li>
    </ul>
    <div class="nav-end"><a href="signup.html" class="nav-cta">Sign Up</a></div>
  </nav>

  <div class="center">
    <div class="card">
      <a href="index.html" class="card-logo">LUXA</a>
      <p class="card-sub">Welcome back</p>
      <h1>Log In</h1>

      <form id="form" novalidate>
        <!-- Honeypot -->
        <input name="website" tabindex="-1" style="opacity:0;position:absolute;height:0;width:0;pointer-events:none" aria-hidden="true" autocomplete="off">

        <!-- Email -->
        <div class="field">
          <label class="flabel" for="email">Email</label>
          <div class="fwrap">
            <input type="email" id="email" name="email" inputmode="email"
                   autocomplete="email" placeholder="you@example.com" required />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label class="flabel" for="pw">Password</label>
          <div class="fwrap">
            <input type="password" id="pw" name="pw" class="pad-r"
                   autocomplete="current-password" placeholder="Your password" required />
            <button type="button" class="eye" id="eye-pw" aria-label="Show password">
              <!-- open eye (shown by default — password is hidden) -->
              <svg class="si eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- closed eye (shown when password is visible) -->
              <svg class="si eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div class="forgot-row"><a href="forgot-password.html">Forgot password?</a></div>
        </div>

        <button type="submit" class="btn" id="btn" disabled>Log In</button>
      </form>

      <div class="div">or continue with</div>

      <div class="socials">
        <!-- Google -->
        <button type="button" class="sbtn" id="btn-google" aria-label="Sign in with Google">

            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <!-- Apple -->
        <button type="button" class="sbtn" id="btn-apple" aria-label="Sign in with Apple">
          <svg class="si" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Apple
        </button>
        <!-- Microsoft -->
        <button type="button" class="sbtn" id="btn-ms" aria-label="Sign in with Microsoft">
          <svg class="si" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
            <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
            <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
            <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
          </svg>
          Microsoft
        </button>
      </div>

      <div class="cfoot">No account? <a href="signup.html">Sign up free</a></div>
    </div>
  </div>
</div>

<script type="module">
  /* ── Stars canvas ── */
  (function(){
    const c=document.getElementById('stars'),cx=c.getContext('2d');
    function draw(){
      c.width=innerWidth; c.height=innerHeight*.65;
      cx.clearRect(0,0,c.width,c.height);
      for(let i=0;i<170;i++){
        cx.beginPath();
        cx.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.1,.0,Math.PI*2);
        cx.fillStyle=`rgba(255,255,255,${(.2+Math.random()*.65).toFixed(2)})`;
        cx.fill();
      }
    }
    draw(); addEventListener('resize',draw);
  })();

  /* ── Back button ── */
  document.getElementById('back-btn').addEventListener('click', () => {
    if (history.length > 1) history.back(); else location.href = 'index.html';
  });

  /* ── Scene parallax (spatial) ── */
  (function(){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const sceneSvg = document.querySelector('.scene svg');
    if (!sceneSvg) return;
    sceneSvg.style.transition = 'transform .6s ease-out';
    sceneSvg.style.willChange = 'transform';
    const MAX = 8;
    let raf = null, nx = 0, ny = 0;
    function schedule(x, y){            // x, y normalized to [-1, 1]
      nx = Math.max(-1, Math.min(1, x));
      ny = Math.max(-1, Math.min(1, y));
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        sceneSvg.style.transform = `translate(${(-nx*MAX).toFixed(2)}px, ${(-ny*MAX).toFixed(2)}px)`;
      });
    }
    if (matchMedia('(pointer: fine)').matches) {
      addEventListener('mousemove', e => {
        schedule((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
      }, { passive: true });
    } else if ('DeviceOrientationEvent' in window) {
      addEventListener('deviceorientation', e => {
        if (e.gamma == null || e.beta == null) return;
        schedule(e.gamma / 30, (e.beta - 45) / 30);
      });
    }
  })();

  /* ── Toast system ── */
  function toast(msg,type='error',ms=5000){
    const c=document.getElementById('toasts'),el=document.createElement('div');
    el.className=`toast ${type}`;
    el.innerHTML=`<span>${{error:'✕',success:'✓',info:'ℹ'}[type]||'ℹ'}</span><span>${msg}</span><button class="toast-x" aria-label="close">✕</button>`;
    el.querySelector('.toast-x').onclick=()=>bye(el);
    c.appendChild(el);
    if(ms>0)setTimeout(()=>bye(el),ms);
  }
  function bye(el){el.classList.add('out');setTimeout(()=>el.remove(),230);}

  /* ── Firebase config ── */
  const FB_CONFIG = {
    apiKey:            window.LUXA_FB_API_KEY            || '',
    authDomain:        window.LUXA_FB_AUTH_DOMAIN        || '',
    projectId:         window.LUXA_FB_PROJECT_ID         || '',
    storageBucket:     window.LUXA_FB_STORAGE_BUCKET     || '',
    messagingSenderId: window.LUXA_FB_SENDER_ID          || '',
    appId:             window.LUXA_FB_APP_ID             || '',
  };

  /* ── Firebase error map ── */
  const FERR={
    'auth/user-not-found':'No account found with this email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-email':'Please enter a valid email.',
    'auth/email-already-in-use':'An account with this email already exists.',
    'auth/weak-password':'Password must be at least 8 characters.',
    'auth/too-many-requests':'Too many attempts. Please wait.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/network-request-failed':'Network error. Check your connection.',
    'auth/user-disabled':'This account has been disabled.',
    'auth/popup-closed-by-user':'Sign-in window was closed.',
    'auth/popup-blocked':'Pop-up blocked. Please allow pop-ups.',
  };

  /* ── Firebase lazy loader ── */
  let _app, _auth;
  async function getFirebase() {
    if (_auth) return { auth: _auth };
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getAuth } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    _app  = getApps().length ? getApps()[0] : initializeApp(FB_CONFIG);
    _auth = getAuth(_app);
    return { auth: _auth };
  }

  /* ── DOM refs ── */
  const emailEl = document.getElementById('email');
  const pwEl    = document.getElementById('pw');
  const btn     = document.getElementById('btn');
  const eyeBtn  = document.getElementById('eye-pw');
  const form    = document.getElementById('form');
  const hp      = form.querySelector('[name="website"]');

  /* ── Eye toggle ── */
  eyeBtn.addEventListener('click', () => {
    const show = pwEl.type === 'password';
    pwEl.type = show ? 'text' : 'password';
    eyeBtn.querySelector('.eye-open').style.display  = show ? 'none' : '';
    eyeBtn.querySelector('.eye-closed').style.display = show ? ''    : 'none';
    eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  /* ── Validation ── */
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function validate() {
    const ok = emailRe.test(emailEl.value.trim())
            && pwEl.value.length > 0
            && hp.value === '';
    btn.disabled = !ok;
  }
  emailEl.addEventListener('input', validate);
  pwEl.addEventListener('input', validate);

  /* ── Email/password submit ── */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (hp.value !== '') return; // honeypot triggered
    if (!FB_CONFIG.apiKey) { toast('Firebase not configured yet.', 'error'); return; }

    const email = emailEl.value.trim();
    const pw    = pwEl.value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Logging in…';

    try {
      const { auth } = await getFirebase();
      const { signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
      await signInWithEmailAndPassword(auth, email, pw);
      toast('Welcome back! Redirecting…', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    } catch (err) {
      toast(FERR[err.code] || err.message || 'Login failed. Try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Log In';
      validate();
    }
  });

  /* ── Social sign-in helper ── */
  async function socialSignIn(providerId) {
    if (!FB_CONFIG.apiKey) { toast('Firebase not configured yet.', 'error'); return; }
    try {
      const { auth } = await getFirebase();
      const { signInWithPopup, GoogleAuthProvider, OAuthProvider } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
      const { getFirestore, doc, getDoc, setDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

      let provider;
      if (providerId === 'google')      provider = new GoogleAuthProvider();
      else if (providerId === 'apple')  provider = new OAuthProvider('apple.com');
      else                              provider = new OAuthProvider('microsoft.com');

      const result = await signInWithPopup(auth, provider);
      const user   = result.user;

      // Create Firestore doc if doesn't exist
      const db  = getFirestore(_app);
      const ref = doc(db, 'users', user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid:               user.uid,
          email:             user.email,
          displayName:       user.displayName || '',
          country:           '',
          luzaId:            `luxa_${(user.displayName||'user').toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,20)}_${user.uid.slice(-6)}`,
          role:              'member',
          isActive:          true,
          recoveryQuestions: [],
          createdAt:         serverTimestamp(),
          updatedAt:         serverTimestamp(),
        });
      }

      toast('Welcome back! Redirecting…', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    } catch (err) {
      toast(FERR[err.code] || err.message || 'Sign-in failed.', 'error');
    }
  }

  document.getElementById('btn-google').addEventListener('click', () => socialSignIn('google'));
  document.getElementById('btn-apple').addEventListener('click',  () => socialSignIn('apple'));
  document.getElementById('btn-ms').addEventListener('click',     () => socialSignIn('microsoft'));
</script>
</body>
</html>
