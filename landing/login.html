<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — LUXA</title>
  <meta name="theme-color" content="#05080f" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%; background: #05080f; color: #F0F4FF;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60vw 60vh at 10% 0%,   rgba(0,102,204,.12) 0%, transparent 65%),
        radial-gradient(ellipse 60vw 60vh at 90% 100%,  rgba(255,107,53,.12) 0%, transparent 65%);
    }
    .page {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: rgba(8,13,26,.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
      animation: rise .7s cubic-bezier(.16,1,.3,1) both;
    }
    .logo {
      display: block; text-align: center;
      font-size: 22px; font-weight: 700; letter-spacing: -.03em;
      color: #fff; text-decoration: none; margin-bottom: 6px;
    }
    .sub { text-align: center; color: rgba(240,244,255,.42); font-size: 13px; margin-bottom: 36px; }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 500; color: rgba(240,244,255,.5); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
    .field { margin-bottom: 18px; }
    input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; color: #F0F4FF;
      font-size: 15px; font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: rgba(0,168,255,.45);
      box-shadow: 0 0 0 3px rgba(0,168,255,.12);
    }
    input::placeholder { color: rgba(240,244,255,.25); }
    .btn {
      width: 100%; padding: 14px;
      background: rgba(0,102,204,.9);
      color: #fff; font-size: 15px; font-weight: 600;
      border: 1px solid rgba(0,168,255,.35);
      border-radius: 14px; cursor: pointer;
      font-family: inherit; letter-spacing: .01em;
      box-shadow: 0 4px 24px rgba(0,102,204,.3), inset 0 1px 0 rgba(255,255,255,.15);
      transition: all .2s cubic-bezier(.16,1,.3,1);
      margin-top: 8px;
    }
    .btn:hover { background: rgba(0,120,235,.95); transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .err {
      background: rgba(255,80,80,.12); border: 1px solid rgba(255,80,80,.25);
      border-radius: 10px; padding: 11px 14px;
      font-size: 13px; color: #ff8080; margin-bottom: 16px; display: none;
    }
    .ok {
      background: rgba(0,200,100,.12); border: 1px solid rgba(0,200,100,.25);
      border-radius: 10px; padding: 11px 14px;
      font-size: 13px; color: #4dffaa; margin-bottom: 16px; display: none;
    }
    .foot { text-align: center; margin-top: 24px; font-size: 13px; color: rgba(240,244,255,.4); }
    .foot a { color: rgba(0,168,255,.8); text-decoration: none; }
    .foot a:hover { color: #00D4FF; }
    .divider { height: 1px; background: rgba(255,255,255,.07); margin: 24px 0; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="card">
    <a href="index.html" class="logo">LUXA</a>
    <p class="sub">Welcome back</p>

    <div class="err" id="err"></div>
    <div class="ok"  id="ok"></div>

    <form id="form">
      <h1>Log In</h1>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" placeholder="Your password" autocomplete="current-password" required />
      </div>
      <button class="btn" id="btn" type="submit">Log In</button>
    </form>

    <div class="divider"></div>
    <p class="foot">No account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script type="module">
  const FB_CONFIG = {
    apiKey:            window.LUXA_FB_API_KEY            || '',
    authDomain:        window.LUXA_FB_AUTH_DOMAIN        || '',
    projectId:         window.LUXA_FB_PROJECT_ID         || '',
    storageBucket:     window.LUXA_FB_STORAGE_BUCKET     || '',
    messagingSenderId: window.LUXA_FB_SENDER_ID          || '',
    appId:             window.LUXA_FB_APP_ID             || '',
  };

  const err = document.getElementById('err');
  const ok  = document.getElementById('ok');
  const btn = document.getElementById('btn');

  function showErr(msg) { err.textContent = msg; err.style.display = 'block'; ok.style.display = 'none'; }
  function showOk(msg)  { ok.textContent  = msg; ok.style.display  = 'block'; err.style.display = 'none'; }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    const email = document.getElementById('email').value.trim();
    const pw    = document.getElementById('pw').value;

    if (!FB_CONFIG.apiKey) {
      showErr('Firebase not configured yet. Coming soon.');
      btn.disabled = false; btn.textContent = 'Log In';
      return;
    }

    try {
      const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const { getAuth, signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');

      const app  = getApps().length ? getApps()[0] : initializeApp(FB_CONFIG);
      const auth = getAuth(app);

      await signInWithEmailAndPassword(auth, email, pw);
      showOk('Welcome back! Redirecting…');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    } catch (e) {
      const msgs = {
        'auth/user-not-found':   'No account found with this email.',
        'auth/wrong-password':   'Incorrect password.',
        'auth/invalid-email':    'Invalid email address.',
        'auth/too-many-requests':'Too many attempts. Try again later.',
        'auth/invalid-credential': 'Incorrect email or password.',
      };
      showErr(msgs[e.code] || e.message || 'Login failed. Try again.');
      btn.disabled = false; btn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
