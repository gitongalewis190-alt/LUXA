<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUXA — Advanced Vehicle Innovation Platform</title>
  <meta name="description" content="Discover, showcase, and acquire advanced vehicle concepts, engineering innovations, and automotive projects. Curated by Antonio." />
  <meta name="theme-color" content="#05080f" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --fire:   #FF6B35;
      --ocean:  #0066CC;
      --cyan:   #00D4FF;
      --text:   #F0F4FF;
      --muted:  rgba(240,244,255,0.45);
      --bg:     #05080f;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Canvas ── */
    #c {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Background atmosphere ── */
    .atm {
      position: fixed; inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60vw 60vh at 15% 5%,  rgba(0,102,204,0.13)  0%, transparent 70%),
        radial-gradient(ellipse 70vw 70vh at 88% 95%, rgba(255,107,53,0.13) 0%, transparent 65%),
        radial-gradient(ellipse 40vw 40vh at 50% 50%, rgba(0,212,255,0.04)  0%, transparent 70%);
    }

    /* ── Hero layout ── */
    .hero {
      position: relative; z-index: 2;
      width: 100%; height: 100svh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0; padding: 24px;
    }

    /* ── Wheel wrapper ── */
    .ww {
      position: relative;
      width: min(72vw, 340px);
      height: min(72vw, 340px);
      margin-bottom: 44px;
      opacity: 0;
      animation: rise .9s cubic-bezier(.16,1,.3,1) .15s both;
    }
    @media (min-width: 640px) {
      .ww { width: 400px; height: 400px; }
    }

    /* glow halo */
    .glow {
      position: absolute;
      inset: -18px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,255,.14), transparent 68%);
      filter: blur(18px);
      animation: breathe 4s ease-in-out infinite;
    }

    /* speed rings */
    .ring {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(0,212,255,.12);
      animation: spinR linear infinite;
    }
    .ring:nth-child(2){ inset: -14px; animation-duration: 22s; }
    .ring:nth-child(3){ inset: -28px; animation-duration: 31s; }
    .ring:nth-child(4){ inset: -42px; animation-duration: 40s; }

    /* the wheel itself */
    .wheel {
      position: absolute; inset: 0; border-radius: 50%;
      overflow: hidden;
      box-shadow:
        0 0 80px rgba(0,0,0,.85),
        0 0 160px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.12);
      animation: spinW 10s linear infinite;
    }
    .wheel img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      border-radius: 50%;
    }

    /* fallback if image missing */
    .wheel-fb {
      width: 100%; height: 100%;
      background: conic-gradient(
        from 0deg,
        #1a2035 0deg 30deg, #263050 30deg 60deg,
        #1a2035 60deg 90deg, #263050 90deg 120deg,
        #1a2035 120deg 150deg, #263050 150deg 180deg,
        #1a2035 180deg 210deg, #263050 210deg 240deg,
        #1a2035 240deg 270deg, #263050 270deg 300deg,
        #1a2035 300deg 330deg, #263050 330deg 360deg
      );
      display: flex; align-items: center; justify-content: center;
    }
    .wheel-fb::after {
      content: '';
      width: 38%; height: 38%;
      background: #090d1a; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.08);
      box-shadow: 0 0 24px rgba(0,212,255,.15);
    }

    /* ── Typography ── */
    .wordmark {
      font-size: clamp(56px, 13vw, 96px);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1;
      text-align: center;
      color: #fff;
      margin-bottom: 14px;
      opacity: 0;
      animation: rise .9s cubic-bezier(.16,1,.3,1) .45s both;
    }

    .tag {
      font-size: clamp(13px, 2.8vw, 17px);
      font-weight: 400;
      letter-spacing: .04em;
      text-align: center;
      color: var(--muted);
      margin-bottom: 44px;
      max-width: 340px;
      line-height: 1.5;
      opacity: 0;
      animation: rise .9s cubic-bezier(.16,1,.3,1) .65s both;
    }

    /* ── Buttons ── */
    .btns {
      display: flex; flex-direction: column;
      gap: 12px; width: 100%; max-width: 320px;
      opacity: 0;
      animation: rise .9s cubic-bezier(.16,1,.3,1) .85s both;
    }
    @media (min-width: 480px) {
      .btns { flex-direction: row; max-width: 400px; }
    }

    .btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 15px 28px;
      border-radius: 16px;
      font-size: 15px; font-weight: 600;
      text-decoration: none; cursor: pointer;
      transition: transform .25s cubic-bezier(.16,1,.3,1),
                  box-shadow .25s cubic-bezier(.16,1,.3,1),
                  background .25s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: .01em;
    }

    .btn-primary {
      background: rgba(0,102,204,.88);
      color: #fff;
      border: 1px solid rgba(0,168,255,.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 28px rgba(0,102,204,.35), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .btn-primary:hover {
      background: rgba(0,120,235,.95);
      transform: translateY(-3px);
      box-shadow: 0 10px 40px rgba(0,102,204,.5), inset 0 1px 0 rgba(255,255,255,.22);
    }

    .btn-secondary {
      background: rgba(255,255,255,.055);
      color: rgba(240,244,255,.82);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,.1);
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    }

    .btn:active { transform: translateY(0) scale(.97) !important; }

    /* ── Keyframes ── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spinW {
      to { transform: rotate(360deg); }
    }
    @keyframes spinR {
      to { transform: rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .7; transform: scale(1); }
      50%       { opacity: 1; transform: scale(1.06); }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

<div class="atm"></div>
<canvas id="c"></canvas>

<div class="hero">
  <div class="ww">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="wheel">
      <img
        src="images/hero-tire.jpg"
        alt="LUXA Wheel"
        onerror="this.outerHTML='<div class=wheel-fb></div>'"
      />
    </div>
  </div>

  <h1 class="wordmark">LUXA</h1>
  <p class="tag">Advanced Vehicle Innovation Platform</p>

  <div class="btns">
    <a href="signup.html" class="btn btn-primary">Sign Up</a>
    <a href="login.html"  class="btn btn-secondary">Log In</a>
  </div>
</div>

<script>
(function () {
  const cv = document.getElementById('c');
  const cx = cv.getContext('2d');
  let W, H, ox, oy, R;

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    const el = document.querySelector('.wheel');
    if (!el) return;
    const r = el.getBoundingClientRect();
    ox = r.left + r.width  / 2;
    oy = r.top  + r.height / 2;
    R  = r.width / 2;
  }

  window.addEventListener('resize', () => { clearTimeout(window._rt); window._rt = setTimeout(resize, 80); });
  setTimeout(resize, 200);

  // ── Particle ──
  function mkP() {
    const a = Math.random() * Math.PI * 2;
    const d = R * (.88 + Math.random() * .18);
    const spd = .6 + Math.random() * 1.6;
    const smoke = Math.random() > .45;
    return {
      x:  ox + Math.cos(a) * d,
      y:  oy + Math.sin(a) * d,
      vx: Math.cos(a) * spd + (Math.random()-.5) * 1.2,
      vy: Math.sin(a) * spd - Math.random() * .6,
      life: .6 + Math.random() * .4,
      decay: .006 + Math.random() * .012,
      size: smoke ? 3 + Math.random() * 5 : 1 + Math.random() * 2.5,
      smoke,
      g: Math.floor(140 + Math.random() * 115),
    };
  }

  const pool = Array.from({ length: 90 }, () => { const p = mkP(); p.life = Math.random(); return p; });

  function tick() {
    cx.clearRect(0, 0, W, H);

    // spawn
    if (Math.random() < .55) {
      const dead = pool.find(p => p.life <= 0);
      if (dead) Object.assign(dead, mkP());
    }

    pool.forEach(p => {
      if (p.life <= 0) return;

      // physics
      p.x  += p.vx;
      p.y  += p.vy;
      p.vx *= .975;
      p.vy  = p.vy * .975 - .018; // upward drift
      p.life -= p.decay;
      if (p.smoke) p.size += .12;

      // draw
      const alpha = Math.max(0, p.life);
      cx.beginPath();
      cx.arc(p.x, p.y, Math.max(.1, p.smoke ? p.size : p.size * .5), 0, Math.PI * 2);
      cx.fillStyle = `rgba(${p.g},${p.g},${p.g+15},${alpha * (p.smoke ? .28 : .7)})`;
      cx.fill();
    });

    requestAnimationFrame(tick);
  }

  // Wait until animations are in — start particles after a beat
  setTimeout(tick, 400);
})();
</script>

</body>
</html>
